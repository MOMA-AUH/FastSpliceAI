[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "spliceai"
version = "2.0.0"
requires-python = ">=3.10,<3.14"
description = "SpliceAI: A deep learning-based tool to identify splice variants"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Kishore Jaganathan", email = "kishorejaganathan@gmail.com" },
]
maintainers = [
    { name = "Jakob Jersild Nielsen", email = "jani@clin.au.dk" },
]
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE", "NOTICE", "spliceai/models/LICENSE"]
dependencies = [
    "bx-python>=0.14.0",
    "h5py>=3.11",
    "numpy>=1.14.0",
    "pyfaidx>=0.5.0",
    "pysam>=0.10.0",
    "torch>=2.6,<3",
]

[project.urls]
Homepage = "https://github.com/MOMA-AUH/FastSpliceAI"

[project.scripts]
spliceai = "spliceai.__main__:main"

[tool.setuptools]
packages = ["spliceai"]
include-package-data = false

[tool.setuptools.package-data]
spliceai = [
    "annotations/grch37.txt",
    "annotations/grch38.txt",
    "models/spliceai1.h5",
    "models/spliceai2.h5",
    "models/spliceai3.h5",
    "models/spliceai4.h5",
    "models/spliceai5.h5",
    "models/LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
